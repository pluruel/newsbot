name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

      - name: Post review status
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.review.outcome }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- claude-review-status -->'
          short_sha="${SHA:0:7}"
          case "$OUTCOME" in
            success)
              body="${marker}
          리뷰 완료 (\`${short_sha}\`) — 지적 사항이 있으면 별도 코멘트로 올라와 있어. 이 코멘트만 있으면 발견된 이슈 없음.
          [실행 로그](${RUN_URL})" ;;
            cancelled)
              body="${marker}
          리뷰 취소됨 (\`${short_sha}\`) — 새 커밋이 푸시돼서 이전 실행이 중단됐어. 최신 커밋 기준 리뷰를 기다리면 돼.
          [실행 로그](${RUN_URL})" ;;
            *)
              body="${marker}
          리뷰 실패 (\`${short_sha}\`, ${OUTCOME}) — 결과를 신뢰하지 마. 로그 확인 필요.
          [실행 로그](${RUN_URL})" ;;
          esac
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
          echo "review outcome: $OUTCOME"