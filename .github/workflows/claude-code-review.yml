name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # The code-review plugin drives `gh pr view` / `gh pr comment`, and the
    # action does not export a token into the Claude session. Without GH_TOKEN
    # every gh call fails auth, so the review gives up after a couple of turns
    # and finishes "successfully" having posted nothing.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The action exchanges the workflow's GitHub OIDC token for a Claude
      # GitHub App token; without this it cannot mint one and fails before it
      # ever reaches the review step.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
