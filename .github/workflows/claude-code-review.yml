name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # The code-review plugin drives `gh pr view` / `gh pr comment`, and the
    # action does not export a token into the Claude session. Without GH_TOKEN
    # every gh call fails auth, so the review gives up after a couple of turns
    # and finishes "successfully" having posted nothing.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The action exchanges the workflow's GitHub OIDC token for a Claude
      # GitHub App token; without this it cannot mint one and fails before it
      # ever reaches the review step.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # settingSources includes "project", so this repo's .claude/settings.json
          # applies here too — and it ships `allow: []` with defaultMode "default"
          # to keep news-tainted local runs on a short leash. Nothing being
          # pre-approved means every tool call wants an interactive prompt, and a
          # headless run has nobody to answer it. Grant the review its tools here
          # rather than loosening settings.json, which also guards /cycle.
          #
          # This mirrors the allowed-tools frontmatter of the plugin's own
          # code-review.md. The MCP entry is the load-bearing one: the plugin
          # posts findings with create_inline_comment, not `gh pr comment`
          # (that is only the no-issues-found summary), so without it the review
          # runs to completion and silently posts nothing — which is exactly the
          # action's "No buffered inline comments" outcome.
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
