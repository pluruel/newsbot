name: build-image

# Build the Docker image on a GitHub-hosted runner (fast network) and push it to
# GHCR. The slow `curl | bash` Claude CLI install is cached as its own layer
# (cache-to/from: gha), so after the first build every later tag is a cache hit.
#
# The VM never builds — it pulls:
#   NEWSPARSER_IMAGE=ghcr.io/<owner>/newsparser:<tag> docker compose pull
#   NEWSPARSER_IMAGE=ghcr.io/<owner>/newsparser:<tag> docker compose up -d --no-build

on:
  push:
    tags:
      - 'v*'          # release flow: `git tag v1.2.3 && git push --tags`
  workflow_dispatch:  # manual run — e.g. to measure build time / push a one-off

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR via the built-in GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags / labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/newsparser
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
