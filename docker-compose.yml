# Containers hold only third-party services. poller/dispatcher run on the host
# as systemd units (deploy/ — see plan-host-migration.md).
# Ports bind to 127.0.0.1: docker publishes bypass ufw INPUT rules, so a bare
# "7687:7687" exposes neo4j to the internet on a public-IP host.
services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: wget -q --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  neo4j_data:
