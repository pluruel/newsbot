services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: wget -q --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  poller:
    build: .
    command: .venv/bin/python -m newsparser.collector.run_poller
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # scheduler and bot run on the host (not in containers) because they invoke
  # the `claude` CLI via subprocess. The CLI lives on the host.

  mcp-server:
    build: .
    command: .venv/bin/python -m newsparser.mcp_server
    ports:
      - "8766:8766"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
