[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsparser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "trafilatura>=1.9",
    "python-telegram-bot>=20.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "neo4j>=6.2.0",
    "fastmcp>=2.0,<4",
    "yfinance>=0.2.40",
    "anthropic>=0.120.2",
    "google-genai>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "freezegun>=1.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["newsparser*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
